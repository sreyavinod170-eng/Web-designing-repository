<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">MyPortfolio</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section>
            <p class="eyebrow">Let's connect</p>
            <h1>Contact Me</h1>
            <p>If you would like to connect with me, you can use the sample form below.</p>

            <!-- Demo only: mailto opens the visitor's email application.
                 For a working online form, connect a backend or form service. -->
            <form class="contact-form" action="mailto:yourname@example.com" method="post" enctype="text/plain">
                <label for="name">Your Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name" required>

                <label for="email">Your Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write your message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Connect With Me</h2>
            <div class="social-links">
                <!-- Replace these sample links with your own profile URLs. -->
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
